spring:
  datasource:
    url: ${FRAME_FORWARD_DB_URL:jdbc:mysql://localhost:3306/frame-forward?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8}
    username: ${FRAME_FORWARD_DB_USERNAME:root}
    password: ${FRAME_FORWARD_DB_PASSWORD:123456}
  flyway:
    locations: classpath:db/migration
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
frame-forward:
  ai:
    qwen-routes:
      course: ${FRAME_FORWARD_QWEN_COURSE_MODEL:qwen3.7-plus}
      coach: ${FRAME_FORWARD_QWEN_COACH_MODEL:qwen-plus}
      default: ${FRAME_FORWARD_QWEN_DEFAULT_MODEL:qwen-plus}
  media:
    storage-root: ${FRAME_FORWARD_MEDIA_ROOT:./var/media}
