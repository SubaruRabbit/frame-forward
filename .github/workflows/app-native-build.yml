name: APP native build

on:
  pull_request:
    paths:
      - 'frame-forward-app/**'
      - '.github/workflows/app-native-build.yml'
  push:
    branches:
      - main
    paths:
      - 'frame-forward-app/**'
      - '.github/workflows/app-native-build.yml'
  workflow_dispatch:
    inputs:
      publish_release:
        description: Build a signed Android release bundle using the production environment.
        required: true
        default: false
        type: boolean

jobs:
  android-debug:
    name: Android debug build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frame-forward-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frame-forward-app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: npm ci
      - run: npm run android:check
      - run: sha256sum android/app/build/outputs/apk/debug/app-debug.apk > android/app/build/outputs/apk/debug/app-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-${{ github.sha }}
          path: |
            frame-forward-app/android/app/build/outputs/apk/debug/app-debug.apk
            frame-forward-app/android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30

  android-release:
    name: Signed Android release bundle
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: frame-forward-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frame-forward-app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: npm ci
      - name: Restore release keystore
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
      - name: Build signed release bundle
        env:
          FRAME_FORWARD_RELEASE_STORE_FILE: release.keystore
          FRAME_FORWARD_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          FRAME_FORWARD_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          FRAME_FORWARD_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: npm run android:release:check
      - run: sha256sum android/app/build/outputs/bundle/release/app-release.aab > android/app/build/outputs/bundle/release/app-release.aab.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: android-release-${{ github.sha }}
          path: |
            frame-forward-app/android/app/build/outputs/bundle/release/app-release.aab
            frame-forward-app/android/app/build/outputs/bundle/release/app-release.aab.sha256
          if-no-files-found: error
          retention-days: 30

  ios-simulator:
    name: iOS release simulator build
    runs-on: macos-14
    defaults:
      run:
        working-directory: frame-forward-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frame-forward-app/package-lock.json
      - run: npm ci
      - run: npm run ios:check
