name: APP quality

on:
  pull_request:
    paths:
      - 'frame-forward-app/**'
      - '.github/workflows/app-quality.yml'
  push:
    branches:
      - main
    paths:
      - 'frame-forward-app/**'
      - '.github/workflows/app-quality.yml'

jobs:
  quality:
    name: Format, lint, typecheck, and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frame-forward-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frame-forward-app/package-lock.json
      - run: npm ci
      - run: npm run quality
